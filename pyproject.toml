[project]
name = "briefing"
version = "0.1.0"
description = "Client meeting briefing intelligence: cited, verified, access-controlled briefings"
authors = [
    { name = "Pranay0205", email = "pranayghuge@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "fastembed>=0.9.1",
    "numpy>=2.5.5",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade, SIM simplify, C4 comprehensions
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["B008"]  # FastAPI-style defaults in signatures

[tool.ruff.format]
quote-style = "double"
